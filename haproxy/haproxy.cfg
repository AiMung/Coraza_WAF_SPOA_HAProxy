# ================================================================
# HAProxy Configuration — Auto-generated by aaWAF Engine
# DO NOT EDIT MANUALLY — Changes will be overwritten on next sync
# ================================================================

global
    log stdout format raw local0
    log waf-backend:5140 local0 info

defaults
    log global
    mode http
    option httplog
    timeout client 1m
    timeout server 1m
    timeout connect 10s
    errorfile 403 /usr/local/etc/haproxy/errors/403.http

frontend default
    mode http
    bind *:80
    log-format "%ci:%cp [%t] %ft %b/%s %ST %B %{+Q}r %[var(txn.coraza.id)] spoa-error:%[var(txn.coraza.error)] waf-action:%[var(txn.coraza.action)] blocked-by:%[var(txn.blocked_by)]"

    # ========================================
    # IP Access Control (Fast-Path Enforcement)
    # ========================================
    acl is_whitelisted src -f /usr/local/etc/haproxy/rules/whitelist.ips
    acl is_blacklisted src -f /usr/local/etc/haproxy/rules/blacklist.ips
    http-request set-var(txn.blocked_by) str(HAProxy-IP-Blacklist) if is_blacklisted !is_whitelisted
    http-request deny deny_status 403 hdr "X-Blocked-By" "HAProxy-IP-Blacklist" if is_blacklisted !is_whitelisted

    # ========================================
    # Internal Challenge & API Gateway
    # ========================================
    acl is_waf_challenge path_beg /waf-challenge /api/challenge
    acl is_waf_dashboard path_beg /api /admin /ws /assets /css /js
    use_backend backend_waf_internal if is_waf_challenge or is_waf_dashboard
    # ========================================
    # Scanner & Malicious Bot Defense
    # ========================================
    acl is_scanner_agent hdr_sub(user-agent) -i sqlmap nikto acunetix nessus masscan gobuster dirbuster wpscan
    http-request set-var(txn.blocked_by) str(aaWAF-Scanner-Shield) if is_scanner_agent !is_whitelisted
    http-request deny deny_status 403 hdr "X-Blocked-By" "aaWAF-Scanner-Shield" if is_scanner_agent !is_whitelisted
    # ========================================
    # CC Defense & HTTP Flood Stick-Table
    # ========================================
    stick-table type ip size 100k expire 10s store http_req_rate(10s)
    # Selective CC Target Domains
    acl is_cc_target_site hdr_beg(host) -i 192.168.246.100
    http-request track-sc0 src if is_cc_target_site !is_whitelisted
    acl is_cc_flooding sc0_http_req_rate gt 60
    acl has_waf_clearance req.cook(waf_clearance) -m found
    # Challenge Mode (Redirect to /waf-challenge)
    http-request set-var(txn.blocked_by) str(aaWAF-CC-Challenge) if is_cc_flooding is_cc_target_site !is_whitelisted !has_waf_clearance !is_waf_challenge
    http-request redirect code 302 location /waf-challenge?return_url=%[path] if is_cc_flooding is_cc_target_site !is_whitelisted !has_waf_clearance !is_waf_challenge

    # ========================================
    # SPOE Coraza WAF Engine Setup
    # ========================================
    http-request set-var(txn.coraza.app) str(sample_app)
    filter spoe engine coraza config /usr/local/etc/haproxy/spoe-coraza.conf
    http-request send-spoe-group coraza coraza-req if !is_whitelisted

    # WAF Action Handlers
    http-request redirect code 302 location %[var(txn.coraza.data)] if { var(txn.coraza.action) -m str redirect }
    http-response redirect code 302 location %[var(txn.coraza.data)] if { var(txn.coraza.action) -m str redirect }
    http-request deny deny_status 403 hdr "X-Blocked-By" "Coraza-WAF-Shield" if { var(txn.coraza.action) -m str deny }
    http-response deny deny_status 403 hdr "X-Blocked-By" "Coraza-WAF-Shield" if { var(txn.coraza.action) -m str deny }
    http-request silent-drop if { var(txn.coraza.action) -m str drop }
    http-response silent-drop if { var(txn.coraza.action) -m str drop }

    # ========================================
    # Virtual Host Routing (Auto-generated)
    # ========================================
    # Site #1: Hệ Thống Web Demo Doanh Nghiệp [WAF: prevention]
    acl host_site_1 hdr_beg(host) -i 192.168.246.100
    use_backend backend_site_1 if host_site_1

    # Site #4: nội bộ [WAF: prevention]
    acl host_site_4 hdr_beg(host) -i aimung.com
    use_backend backend_site_4 if host_site_4

    default_backend protected-app-backend

# ========================================
# Backend Definitions (Auto-generated)
# ========================================

# Backend: aaWAF Internal Engine (Challenge & API Gateway)
backend backend_waf_internal
    mode http
    server waf_core waf-backend:8080 check

# Backend: Hệ Thống Web Demo Doanh Nghiệp (192.168.246.100) → protected-app:80
backend backend_site_1
    mode http
    server origin_1 protected-app:80 check inter 5s fall 3 rise 2

# Backend: nội bộ (aimung.com) → 192.168.246.1:3000
backend backend_site_4
    mode http
    server origin_4 192.168.246.1:3000 check inter 5s fall 3 rise 2

# Default fallback backend (Demo Web Application)
backend protected-app-backend
    mode http
    server web_app protected-app:80 check

# SPOE Coraza TCP backend
backend spoe-coraza
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 3m
    server spoa coraza-spoa:9000

# HAProxy Internal Prometheus/CSV Stats (accessed by waf-backend)
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
