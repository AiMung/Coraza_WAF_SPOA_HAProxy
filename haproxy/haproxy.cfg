global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    errorfile 403 /usr/local/etc/haproxy/errors/403.http

frontend http-in
    bind *:80
    unique-id-format %[uuid()]
    unique-id-header X-Unique-ID

    # HAProxy SPOE Filter to Coraza WAF
    filter spoe engine coraza config /usr/local/etc/haproxy/spoe-coraza.conf

    # Block request if Coraza engine triggers deny action
    http-request deny status 403 hdr "X-Blocked-By" "Coraza-WAF-Shield" if { var(txn.coraza.action) -m str deny }
    http-response deny status 403 hdr "X-Blocked-By" "Coraza-WAF-Shield" if { var(res.coraza.action) -m str deny }

    # Pass clean traffic to target backend
    default_backend protected-app-backend

backend protected-app-backend
    balance roundrobin
    option httpchk GET /
    server web_app protected-app:80 check

backend spoe-coraza
    mode tcp
    balance roundrobin
    timeout connect 2000ms
    timeout server  5000ms
    server spoa coraza-spoa:9000 check maxconn 500
