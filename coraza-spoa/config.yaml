bind: 0.0.0.0:9000

log_level: info
log_file: /dev/stdout
log_format: console

default_application: sample_app

applications:
  - name: sample_app
    directives: |
      Include /etc/coraza-spoa/coraza.conf
      Include /etc/coraza-spoa/coreruleset/crs-setup.conf
      Include /etc/coraza-spoa/coreruleset/rules/*.conf
      Include /etc/coraza-spoa/rules/*.conf

    response_check: false
    transaction_ttl_ms: 60000
    log_level: info
    log_file: /dev/stdout
    log_format: console
