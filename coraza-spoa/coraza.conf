# ==========================================
# Coraza WAF Main Configuration
# ==========================================

# Enable SecRuleEngine: On (Enforce/Block), DetectionOnly (Audit only), Off
SecRuleEngine On

# Request Body Handling
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response Body Handling
SecResponseBodyAccess Off
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# Temp & Data Directories
SecTmpDir /tmp/
SecDataDir /tmp/

# Audit Logging Configuration (JSON output for Go Backend stream & Telegram Alerts)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/coraza/audit.log
SecAuditLogFormat JSON

# Default Actions: Deny with HTTP 403 on rule match
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"
