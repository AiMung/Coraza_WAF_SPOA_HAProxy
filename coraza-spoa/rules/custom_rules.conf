# ==========================================
# Custom WAF Rules & Demo Test Signatures
# ==========================================

# 1. Custom Smoke Test Rule (Triggers with ?testwaf=attack)
SecRule ARGS:testwaf "@streq attack" \
    "id:1001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Test WAF Signature Detected - System Verified',\
    tag:'custom-test',\
    severity:'CRITICAL'"

# 2. Block Malicious User-Agents / Security Scanners
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|acunetix|nessus|nmap|masscan|dirbuster|gobuster|wpscan)" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Security Scanner / Vulnerability Probing Detected',\
    tag:'scanner-block',\
    severity:'CRITICAL'"

# 3. Quick Block for Simple SQL Injection Patterns
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?i)(union\s+select|select\s+.*\s+from|or\s+1\s*=\s*1|and\s+1\s*=\s*1|--\s*$|information_schema|sys\.tables)" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Generic SQL Injection Pattern Matched',\
    tag:'sqli',\
    severity:'CRITICAL'"

# 4. Quick Block for Cross-Site Scripting (XSS)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?i)(<script\b|javascript:|onerror\s*=|onload\s*=|alert\(|document\.cookie)" \
    "id:1004,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Generic Cross-Site Scripting (XSS) Matched',\
    tag:'xss',\
    severity:'CRITICAL'"

# 5. Quick Block for Local File Inclusion (LFI / Path Traversal)
SecRule ARGS|REQUEST_URI "@rx (?i)(\.\./|\.\.\\|/etc/passwd|/etc/shadow|/windows/win\.ini|/boot\.ini)" \
    "id:1005,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Path Traversal / Local File Inclusion (LFI) Attempt',\
    tag:'lfi',\
    severity:'CRITICAL'"
